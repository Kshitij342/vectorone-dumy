<!DOCTYPE html>
<html lang="en">
<head>
  <script src="../js/api.js"></script>
  <script src="js/auth-guard.js"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Attendance Management · VectorOne</title>
  <meta name="description" content="Attendance management for the VectorOne admin portal." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/dashboard.css" />
  <link rel="stylesheet" href="css/admin-dashboard.css" />
  <link rel="stylesheet" href="css/attendance.css" />
  <script>(function(){var saved=localStorage.getItem('cc-theme');var theme=saved||(window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');document.documentElement.setAttribute('data-theme',theme);})();</script>
</head>
<body>
  <header class="navbar">
    <div class="navbar-left"><button type="button" class="icon-btn sidebar-toggle" id="sidebarToggle" aria-label="Toggle sidebar" aria-expanded="true"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M3.5 6.5h17M3.5 12h17M3.5 17.5h17" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button><a href="admin-dashboard.html" class="navbar-brand"><svg class="navbar-logo" viewBox="0 0 80 80" fill="none" aria-hidden="true"><path d="M14 20 L40 62 L66 20" stroke="var(--primary)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><circle cx="40" cy="14" r="6" fill="var(--primary)" /></svg><span>VectorOne</span></a><span class="navbar-divider" aria-hidden="true"></span><h1 class="navbar-page-title">Attendance</h1></div>
    <div class="navbar-center"><div class="search-wrap" id="searchWrap"><svg class="search-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="11" cy="11" r="6.5" stroke="currentColor" stroke-width="1.8"/><path d="M20 20l-3.6-3.6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg><input type="search" id="globalSearch" class="search-input" placeholder="Search students, years, divisions..." aria-label="Global search" autocomplete="off"/><button type="button" class="search-clear" id="searchClear" aria-label="Clear search"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button><kbd class="search-kbd" aria-hidden="true">/</kbd><div class="search-panel" id="searchPanel" role="listbox" hidden><div class="search-section"><p class="search-section-title">Global search</p><ul class="search-list" id="searchResultsList"></ul></div></div></div></div>
    <div class="navbar-right"><div class="popover-wrap"><button type="button" class="icon-btn" id="notificationBtn" aria-label="Notifications" aria-haspopup="true" aria-expanded="false" aria-controls="notificationPanel"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M6 9.5a6 6 0 0 1 12 0v4l1.8 3H4.2L6 13.5v-4Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M9.5 19.5a2.6 2.6 0 0 0 5 0" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg><span class="badge" id="notificationBadge">4</span></button><div class="notification-panel" id="notificationPanel" role="menu" aria-label="Notifications" hidden><div class="panel-flyout-header"><h2>Notifications</h2><button type="button" class="link-inline" id="markAllReadBtn">Mark all as read</button></div><ul class="notification-list" id="notificationList"></ul></div></div><button type="button" id="themeToggle" class="icon-btn theme-toggle" aria-label="Switch to light theme" aria-pressed="false"><svg class="icon icon-sun" ...></svg><svg class="icon icon-moon" ...></svg></button><div class="popover-wrap"><button type="button" class="user-menu-btn" id="userMenuBtn" aria-haspopup="true" aria-expanded="false" aria-controls="userDropdown"><span class="avatar" aria-hidden="true">AD</span><span class="user-menu-name">Aarav Deshmukh</span><svg class="user-menu-chevron" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button><div class="user-dropdown" id="userDropdown" role="menu" hidden><a href="profile.html" role="menuitem">Profile</a><a href="settings.html" role="menuitem">Settings</a><hr><a href="../login.html" role="menuitem" class="user-dropdown-danger">Log out</a></div></div></div>
  </header>
  <div class="app-body"><div class="sidebar-backdrop" id="sidebarBackdrop"></div><aside class="sidebar" id="sidebar"><nav class="sidebar-nav" aria-label="Administrator navigation" id="adminNav"></nav><div class="sidebar-footer"><a href="../login.html" class="sidebar-link sidebar-link--danger"><span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true" focusable="false"><path d="M14.5 4.5H6.5a1 1 0 0 0-1 1v13a1 1 0 0 0 1 1h8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M11.8 12h9M18 8.8l3.2 3.2-3.2 3.2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span>Logout</span></a></div></aside>
    <main class="main-content admin-main-content">
      <section class="admin-page-header"><div><p class="eyebrow">Administration</p><h2>Attendance Management</h2><p>Monitor class attendance and at-risk students.</p></div><div class="admin-header-actions"><button class="btn btn-primary" type="button" id="downloadAttendanceBtn">Export Report</button><button class="btn btn-outline" type="button" id="refreshAttendanceBtn">Refresh</button></div></section>
      <section class="stats-grid admin-stats-grid" id="attendanceStats" aria-label="Attendance statistics"></section>
      <section class="panel attendance-panel">
        <div class="table-toolbar">
          <div class="search-field"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="11" cy="11" r="6.5" stroke="currentColor" stroke-width="1.8"/><path d="M20 20l-3.6-3.6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg><input id="attendanceSearch" type="search" placeholder="Search student" aria-label="Search attendance" /></div>
          <select id="attendanceDeptFilter"><option value="">Department</option></select>
          <select id="attendanceYearFilter"><option value="">Year</option></select>
          <select id="attendanceDivisionFilter"><option value="">Division</option></select>
          <select id="attendanceDateFilter"><option value="">Date</option><option value="2025-08-11">2025-08-11</option><option value="2025-08-12">2025-08-12</option><option value="2025-08-13">2025-08-13</option></select>
        </div>
        <div class="attendance-visual" id="attendanceVisual"></div>
        <div class="table-scroll"><table class="data-table attendance-table"><thead><tr><th>Student ID</th><th>Student</th><th>Department</th><th>Year</th><th>Division</th><th>Present</th><th>Absent</th><th>Attendance %</th><th>Status</th></tr></thead><tbody id="attendanceTableBody"></tbody></table></div>
      </section>
    </main>
  </div>
  <script src="js/admin-dashboard.js"></script>
  <script src="js/attendance.js"></script>
</body>
</html>
